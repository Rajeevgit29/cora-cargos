<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
<defs>
<filter id="grain" x="0" y="0" width="100%" height="100%">
<feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch" seed="7"/>
<feColorMatrix type="saturate" values="0"/>
<feComponentTransfer><feFuncA type="table" tableValues="0 0.10"/></feComponentTransfer>
</filter>
<filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="22"/></filter>
<filter id="softer" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="9"/></filter>
<radialGradient id="light" cx="38%" cy="30%" r="85%">
<stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
<stop offset="1" stop-color="#000" stop-opacity="0.22"/>
</radialGradient>
</defs>
<rect width="1600" height="1000" fill="#2C4FA0"/>
<path d="M 640 130 C 640 40 960 40 960 130" fill="none" stroke="#E8DFCF" stroke-width="26"/>
<g transform="translate(18 26)" opacity="0.45" filter="url(#soft)"><path d="M 520 160 L 1080 160 L 1120 900 L 480 900 Z" fill="#000"/></g>
<path d="M 520 160 L 1080 160 L 1120 900 L 480 900 Z" fill="#E8DFCF"/>
<g transform="translate(560 260)">
<g style="mix-blend-mode:multiply">
<circle cx="330" cy="140" r="130" fill="#E2483D"/>
<text x="10" y="300" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="900" font-size="150" fill="#2C4FA0">FIELD</text>
<text x="10" y="440" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="900" font-size="150" fill="#E2483D">WORK</text>
</g>
<text x="14" y="530" font-family="'Courier New', Courier, monospace" font-size="22" letter-spacing="4" fill="#2C4FA0">BRING A BLANKET</text>
</g>
<rect width="1600" height="1000" fill="url(#light)"/>
<rect width="1600" height="1000" filter="url(#grain)"/></svg>