<text x="470" y="348" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="48" fill="#F3EBDD">ph</text>
<rect x="720" y="40" width="160" height="190" fill="#BCD0D6" stroke="#22314A" stroke-width="3" stroke-dasharray="6 5"/>
